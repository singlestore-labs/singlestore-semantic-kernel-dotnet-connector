name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

env:
  DOTNET_VERSION: 10.0.x

jobs:
  fetch-s2-versions:
    name: Fetch SingleStore supported versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.get_versions.outputs.versions }}
    steps:
      - name: Get supported versions of SingleStore
        id: get_versions
        uses: singlestore-labs/singlestore-supported-versions@main
        with:
          include_rc: true

  ubuntu-tests:
    name: "Test Ubuntu (S2: ${{ matrix.singlestore_version }})"
    needs: fetch-s2-versions
    runs-on: ubuntu-latest

    strategy:
      matrix:
        singlestore_version: ${{ fromJson(needs.fetch-s2-versions.outputs.versions) }}

    services:
      singlestore:
        image: ghcr.io/singlestore-labs/singlestoredb-dev:latest
        env:
          SINGLESTORE_VERSION: ${{ matrix.singlestore_version }}
          ROOT_PASSWORD: ${{ secrets.SINGLESTORE_PASSWORD }}
        ports:
          - 3306:3306

    env:
      SingleStore__ConnectionString: "Server=127.0.0.1;Port=3306;User ID=root;Password=${{ secrets.SINGLESTORE_PASSWORD }};AllowLoadLocalInfile=True;"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run unit tests
        run: dotnet test SingleStore.SemanticKernel.UnitTests/SingleStore.SemanticKernel.UnitTests.csproj --framework net10.0 --configuration Release

      - name: Run conformance tests
        run: dotnet test SingleStore.SemanticKernel.ConformanceTests/SingleStore.SemanticKernel.ConformanceTests.csproj --framework net10.0 --configuration Release

  windows-tests:
    name: "Test Windows"
    runs-on: windows-latest

    env:
      S2MS_API_KEY: ${{ secrets.S2MS_API_KEY }}
      SINGLESTORE_PASSWORD: ${{ secrets.SINGLESTORE_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install singlestoredb

      - name: Start SingleStore
        run: |
          python .github/scripts/s2ms_cluster.py start singlestoretest
          $endpoint = (Get-Content -Raw WORKSPACE_ENDPOINT_FILE).Trim()
          "SingleStore__ConnectionString=Server=$endpoint;Port=3306;User ID=admin;Password=$env:SINGLESTORE_PASSWORD;" |
          Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run unit tests
        run: dotnet test SingleStore.SemanticKernel.UnitTests/SingleStore.SemanticKernel.UnitTests.csproj --framework net472 --configuration Release

      - name: Run conformance tests
        run: dotnet test SingleStore.SemanticKernel.ConformanceTests/SingleStore.SemanticKernel.ConformanceTests.csproj --framework net472 --configuration Release

      - name: Stop SingleStore
        if: always()
        run: python .github/scripts/s2ms_cluster.py terminate
  
  release:
    needs: [ubuntu-tests, windows-tests]
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set version
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build project binaries
        run: dotnet build SingleStore.SemanticKernel/SingleStore.SemanticKernel.csproj -c Release -p:Version=${{ env.RELEASE_VERSION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Binaries with Artifact Signing
        uses: Azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: SingleStore.SemanticKernel/bin/Release
          files-folder-filter: SingleStore.SemanticKernel.dll
          files-folder-recurse: true

      - name: Pack project binaries
        run: dotnet pack SingleStore.SemanticKernel/SingleStore.SemanticKernel.csproj -c Release -p:Version=${{ env.RELEASE_VERSION }} --no-build

      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Push the package
      - name: NuGet push
        shell: bash
        run: |
          dotnet nuget push "SingleStore.SemanticKernel/bin/Release/SingleStore.SemanticKernel.${{ env.RELEASE_VERSION }}.nupkg" \
          --api-key ${{steps.login.outputs.NUGET_API_KEY}} \
          --source https://api.nuget.org/v3/index.json

      - name: Release on GitHub
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          generate_release_notes: true
          files: SingleStore.SemanticKernel/bin/Release/SingleStore.SemanticKernel.${{ env.RELEASE_VERSION }}.nupkg
          fail_on_unmatched_files: true
